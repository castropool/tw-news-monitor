# ══════════════════════════════════════════════════════════════════
# 国际媒体免费监测层 Phase I（2026-08-13 调研结论，详见
# docs/international_sources_research.md）
# 三类 collector（reuters / ft_alphaville / wsj_rss）已于 Phase I 实现并
# 注册 COLLECTOR_MAP；wsj_rss 停用（enabled: false）但类完整可用。
# ══════════════════════════════════════════════════════════════════
# Reuters：官方 RSS 已停用（arc/outboundfeeds 各 rss 端点 404）；
# 使用官方 Google News sitemap（news-sitemap-index / news-sitemap 分页）。
# 栏目可由 URL path 派生（/world/ /business/ /markets/ /technology/ 等）。
- access_level: metadata_only
  category: international
  enabled: false
  id: reuters_international
  language: en
  name: Reuters
  type: reuters
  url: https://www.reuters.com/arc/outboundfeeds/news-sitemap-index/?outputType=xml
# Financial Times：FT Alphaville 官方 RSS，RSS 2.0，
# 提供 title / description(简短摘要) / link / pubDate / guid，无全文。
- access_level: public
  category: international
  enabled: false
  id: ft_alphaville
  language: en
  name: Financial Times
  section: alphaville
  type: ft_alphaville
  url: https://www.ft.com/alphaville?format=rss
# WSJ：只接收操作员授权邮箱中、InternationalNews label 下的官方 Newsletter。
# 当前 disabled；没有真实 OAuth/Newsletter 验收时不得打开。
- access_level: newsletter
  article_allowlist:
  - wsj.com
  category: international
  enabled: false
  id: wsj_newsletter
  language: en
  mailbox_label: InternationalNews
  mailbox_since: 1d
  name: Wall Street Journal
  sender_allowlist:
  - wsj.com
  - dowjones.com
  type: wsj_newsletter
  url: https://www.wsj.com/newsletters
# Bloomberg：同样仅走只读邮箱 adapter；普通网页/robots 受限入口不作为 collector。
- access_level: newsletter
  article_allowlist:
  - bloomberg.com
  category: international
  enabled: false
  id: bloomberg_newsletter
  language: en
  mailbox_label: InternationalNews
  mailbox_since: 1d
  name: Bloomberg
  sender_allowlist:
  - bloomberg.com
  - bloombergmedia.com
  type: bloomberg_newsletter
  url: https://www.bloomberg.com/account/newsletters
# Wall Street Journal：官方 Dow Jones RSS 技术上可访问但已冻结
# （lastBuildDate≈2025-01-27）且条目均标 PAID（AccessClassName）→ 判定
# 不可靠，Phase I 停用（enabled: false），仅保留条目与 collector/adapter 占位。
- access_level: metadata_only
  category: international
  enabled: false
  id: wsj_international
  language: en
  name: Wall Street Journal
  section: world
  type: wsj_rss
  url: https://feeds.a.dj.com/rss/RSSWorldNews.xml


schema_version: "1.0"

# KOL registry: 20 leading Taiwan-based / Taiwan-focused commentators and
# opinion leaders, chosen to cover explainer channels, cross-strait and
# international commentary, and political commentators across the spectrum.
# Inclusion records who is monitored; it is not an endorsement.
#
# Shares the political social monitor's schema and safety rules:
# - person_category defaults to "kol" for every person in this file;
# - accounts are CANDIDATES until verified.  Collection only starts after
#     python -m app.social_monitor.cli verify --account-id <id> [--url <channel/feed URL>]
#   proves the identifier on a networked machine (YouTube channel feed or
#   RSS feed whose title/author must match the names below).  Results are
#   stored in data/social_monitor/account_verifications.json.
# - youtube accounts are collected from the public channel feed (no API key
#   needed; YOUTUBE_API_KEY optional).  facebook/threads/x accounts need a
#   feed_url (e.g. an operator-run RSS bridge); their official adapters are
#   not implemented and fail closed.
# - canonical_url values below are left empty unless a candidate is known;
#   supply the URL to the verify command instead of guessing.
#
# account_id convention: kol_<slug>_<platform>.  monitoring_priority is the
# scheduling tier (config/social_monitor.yaml scheduling.tier_intervals_minutes).

monitoring_defaults:
  timezone: Asia/Taipei
  backfill_days: 7

persons:
  - person_id: kol_shasha77
    canonical_name: 志祺七七
    display_name: 志祺七七
    aliases: [張志祺, 志祺, shasha77]
    current_role: 時事解說 YouTuber
    focus: [時事解析, 公共政策]
    monitoring_tier: 2
    enabled: true
    accounts:
